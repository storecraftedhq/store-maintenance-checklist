name: store-maintenance-checklist

services:
  mysql:
    image: mysql:8.0
    container_name: store-maintenance-checklist-mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wordpress

  wordpress:
    image: wordpress:latest
    container_name: store-maintenance-checklist-wordpress
    depends_on:
      - mysql
      - mailpit
    ports:
      - "${WP_ENV_PORT:-8888}:80"
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/store-maintenance-checklist
      - ./bin/docker/mailpit-smtp.php:/var/www/html/wp-content/mu-plugins/mailpit-smtp.php
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'FS_METHOD', 'direct' );

  mailpit:
    image: axllent/mailpit
    container_name: store-maintenance-checklist-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: store-maintenance-checklist-phpmyadmin
    depends_on:
      - mysql
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: password
      UPLOAD_LIMIT: 64M

volumes:
  wordpress_data:
  mysql_data:
